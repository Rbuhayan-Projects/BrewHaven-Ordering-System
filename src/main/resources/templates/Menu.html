<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Brew Haven</title>
    <link rel="stylesheet" th:href="@{/menu.css}">
</head>
<body>

<!-- Header + category tabs -->
<header class="topbar">
    <div class="topbar-row">
        <a class="back" th:href="@{/}">&larr; Back</a>
        <h1 class="brand">Brew<span>Haven</span></h1>
        <span class="spacer"></span>
    </div>

    <nav class="tabs" id="tabs">
        <button type="button" class="tab active" data-cat="All">All</button>
        <button type="button" class="tab" th:each="cat : ${categories}"
                th:text="${cat}" th:attr="data-cat=${cat}">Category</button>
    </nav>
</header>

<!-- Menu items -->
<main class="menu">
    <article class="card" th:each="item : ${items}"
             th:attr="data-id=${item.id},data-category=${item.category},data-name=${item.name},data-price=${item.price}">

        <div class="emoji">
            <img th:src="@{/images/{file}(file=${item.image})}" th:alt="${item.name}">
        </div>

        <div class="info">
            <h2 class="name" th:text="${item.name}">Item name</h2>
            <p class="desc" th:text="${item.description}">Description</p>
            <div class="bottom">
                <span class="price" th:text="'₱' + ${#numbers.formatDecimal(item.price, 1, 2)}">₱0.00</span>

                <div class="controls">
                    <button type="button" class="add-btn">Add</button>
                    <div class="stepper">
                        <button type="button" class="minus" aria-label="Remove one">&minus;</button>
                        <span class="qty">0</span>
                        <button type="button" class="plus" aria-label="Add one">+</button>
                    </div>
                </div>
            </div>
        </div>
    </article>
</main>

<!-- Bottom cart bar -->
<div class="cart-bar" id="cartBar">
    <div class="cart-summary">
        <span class="cart-count" id="cartCount">0 items</span>
        <span class="cart-total" id="cartTotal">₱0.00</span>
    </div>
    <button type="button" class="view-btn" id="openCart">View Order</button>
</div>

<!-- Order drawer -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
    <div class="drawer-head">
        <h2>Your Order</h2>
        <button type="button" class="close" id="closeCart" aria-label="Close">&times;</button>
    </div>
    <ul class="order-list" id="orderList"></ul>
    <div class="drawer-foot">
        <div class="total-row">
            <span>Total</span>
            <strong id="drawerTotal">₱0.00</strong>
        </div>
        <button type="button" class="place-btn" id="placeOrder">Place Order</button>
    </div>
</aside>

<script>
    var cart = {};
    try { cart = JSON.parse(sessionStorage.getItem('cart')) || {}; } catch (e) { cart = {}; }

    function save() {
        try { sessionStorage.setItem('cart', JSON.stringify(cart)); } catch (e) {}
    }

    function money(n) { return '₱' + n.toFixed(2); }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function change(id, name, price, delta) {
        var item = cart[id] || { id: id, name: name, price: price, qty: 0 };
        item.qty += delta;
        if (item.qty <= 0) { delete cart[id]; } else { cart[id] = item; }
        save();
        render();
    }

    function render() {
        var count = 0, total = 0;
        Object.keys(cart).forEach(function (k) {
            count += cart[k].qty;
            total += cart[k].qty * cart[k].price;
        });

        document.querySelectorAll('.card').forEach(function (card) {
            var entry = cart[card.dataset.id];
            var qty = entry ? entry.qty : 0;
            card.querySelector('.qty').textContent = qty;
            card.classList.toggle('in-cart', qty > 0);
        });

        document.getElementById('cartCount').textContent = count + (count === 1 ? ' item' : ' items');
        document.getElementById('cartTotal').textContent = money(total);
        document.getElementById('cartBar').classList.toggle('show', count > 0);
        document.getElementById('drawerTotal').textContent = money(total);

        var list = document.getElementById('orderList');
        list.innerHTML = '';
        Object.keys(cart).forEach(function (k) {
            var i = cart[k];
            var li = document.createElement('li');
            li.innerHTML =
                '<div class="o-name">' + escapeHtml(i.name) +
                '<small>' + money(i.price) + ' each</small></div>' +
                '<div class="stepper show" data-id="' + i.id + '">' +
                '<button type="button" class="d-minus">&minus;</button>' +
                '<span class="qty">' + i.qty + '</span>' +
                '<button type="button" class="d-plus">+</button></div>' +
                '<div class="o-sub">' + money(i.qty * i.price) + '</div>';
            list.appendChild(li);
        });

        if (count === 0) { closeDrawer(); }
    }

    function openDrawer() {
        document.getElementById('drawer').classList.add('open');
        document.getElementById('overlay').classList.add('open');
    }
    function closeDrawer() {
        document.getElementById('drawer').classList.remove('open');
        document.getElementById('overlay').classList.remove('open');
    }

    document.querySelector('.menu').addEventListener('click', function (e) {
        var card = e.target.closest('.card');
        if (!card) return;
        var id = card.dataset.id, name = card.dataset.name, price = parseFloat(card.dataset.price);

        if (e.target.closest('.add-btn') || e.target.closest('.plus')) {
            change(id, name, price, 1);
        } else if (e.target.closest('.minus')) {
            change(id, name, price, -1);
        }
    });

    document.getElementById('orderList').addEventListener('click', function (e) {
        var stepper = e.target.closest('.stepper');
        if (!stepper) return;
        var entry = cart[stepper.dataset.id];
        if (!entry) return;
        if (e.target.closest('.d-plus')) { change(entry.id, entry.name, entry.price, 1); }
        if (e.target.closest('.d-minus')) { change(entry.id, entry.name, entry.price, -1); }
    });

    document.getElementById('tabs').addEventListener('click', function (e) {
        var tab = e.target.closest('.tab');
        if (!tab) return;
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        var cat = tab.dataset.cat;
        document.querySelectorAll('.card').forEach(function (card) {
            card.style.display = (cat === 'All' || card.dataset.category === cat) ? '' : 'none';
        });
    });

    document.getElementById('openCart').addEventListener('click', openDrawer);
    document.getElementById('closeCart').addEventListener('click', closeDrawer);
    document.getElementById('overlay').addEventListener('click', closeDrawer);

    document.getElementById('placeOrder').addEventListener('click', function () {
        if (Object.keys(cart).length === 0) return;
        save();
        window.location.href = '/checkout';
    });

    render();
</script>
</body>
</html>
